[package]
name = "grabwin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast per-window screenshots on Windows via Windows Graphics Capture"
repository = "https://github.com/semetronix/grabwin"

[lib]
name = "grabwin"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
numpy = "0.29"
png = "0.18"
log = "0.4"
pyo3-log = "0.13"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
